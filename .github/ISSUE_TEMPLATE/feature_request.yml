name: Feature idea
description: Suggest a check, policy option, integration, or improvement
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What would you like agent-firebreak to do?
    validations:
      required: true
  - type: checkboxes
    id: help
    attributes:
      label: Contributing
      options:
        - label: I'd be happy to open a pull request for this.
