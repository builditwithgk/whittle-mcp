[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "whittle-mcp"
version = "0.1.1"
description = "Trim what your agent reads, and measure what it kept: test, log, JSON, diff and OpenAPI trimmers as an MCP server and a CLI filter, with a retention-checked benchmark."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "Gopi K Aitham (builditwithgk)" }]
keywords = ["mcp", "model-context-protocol", "llm", "tokens", "context", "ai-agents", "cost"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Libraries",
    "Topic :: Text Processing :: Filters",
]
# The trimming core is pure standard library (it also runs in the browser through Pyodide); only the MCP server needs `mcp`.
dependencies = ["mcp>=2.0"]

[project.optional-dependencies]
tokens = ["tiktoken>=0.7"]
yaml = ["pyyaml>=6"]
dev = ["pytest>=8", "tiktoken>=0.7", "pyyaml>=6", "ruff", "mypy"]

[project.urls]
Homepage = "https://scaleup-solutions.in/"
Repository = "https://github.com/builditwithgk/whittle-mcp"
Issues = "https://github.com/builditwithgk/whittle-mcp/issues"

[project.scripts]
whittle = "whittle_mcp.cli:main"
whittle-mcp = "whittle_mcp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/whittle_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 140
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "B"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501", "B017", "W291"]
"bench/*" = ["E501"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
